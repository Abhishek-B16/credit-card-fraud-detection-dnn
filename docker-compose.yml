version: '3.8'

services:
  fraud-detection-app:
    build: .
    container_name: fraud_detection_dnn
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
